[platformio]
default_envs = esp32_01, esp32_02, esp32_03

; Reuse the platform already verified for the four-slot baseline.
[env]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 256dpi/MQTT@2.5.3

[env:esp32_01]
build_flags = -DPARKING_BOARD_ID=1

[env:esp32_02]
build_flags = -DPARKING_BOARD_ID=2

[env:esp32_03]
build_flags = -DPARKING_BOARD_ID=3

; Explicit cloud targets; verified local defaults above are unchanged.
[env:esp32_01_cloud]
extends = env:esp32_01
build_flags = -DPARKING_BOARD_ID=1 -DPARKING_MQTT_TLS=1
lib_deps =
lib_extra_dirs = .pio/libdeps/esp32_01

[env:esp32_02_cloud]
extends = env:esp32_02
build_flags = -DPARKING_BOARD_ID=2 -DPARKING_MQTT_TLS=1
lib_deps =
lib_extra_dirs = .pio/libdeps/esp32_02

[env:esp32_03_cloud]
extends = env:esp32_03
build_flags = -DPARKING_BOARD_ID=3 -DPARKING_MQTT_TLS=1
lib_deps =
lib_extra_dirs = .pio/libdeps/esp32_03
