[platformio]
default_envs = esp32_01, esp32_02, esp32_03

; Reuse the platform already verified for the four-slot baseline.
[env]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:esp32_01]
build_flags = -DPARKING_BOARD_ID=1

[env:esp32_02]
build_flags = -DPARKING_BOARD_ID=2

[env:esp32_03]
build_flags = -DPARKING_BOARD_ID=3
